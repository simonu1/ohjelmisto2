<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TV Series Search</title>
  <script src="index.js" defer></script>
</head>
<body>
  <h1>Search TV Series</h1>
  
  <form id="search-form" action="https://api.tvmaze.com/search/shows">
    <input id="query" name="q" type="text" placeholder="Enter TV show..." required />
    <input type="submit" value="Search" />
  </form>

  <div id="results"></div>
</body>
</html>
